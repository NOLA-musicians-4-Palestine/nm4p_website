# Instrument -> chart key.
#   token   : the <transposition>[-bass] key of the part chart to pick
#             (concert | Bb | Eb | F | concert-bass | Bb-bass | Eb-bass), or null
#   aliases : per-instrument charts (e.g. Tarweedeh) this player reads, in order of preference
# Edit freely: this drives the "Pick your instrument" dropdown.
- name: Flute
  token: concert
  aliases: [flute]
- name: Oboe
  token: concert
  aliases: [flute]
- name: Violin
  token: concert
  aliases: [flute]
- name: Clarinet
  token: Bb
  aliases: [clarinet, trumpet]
- name: Soprano Sax
  token: Bb
  aliases: [trumpet]
- name: Trumpet
  token: Bb
  aliases: [trumpet]
- name: Cornet
  token: Bb
  aliases: [trumpet]
- name: Alto Sax
  token: Eb
  aliases: [alto]
- name: Tenor Sax
  token: Bb
  aliases: [tenor]
- name: Baritone Sax
  token: Eb
  aliases: [bari, alto]
- name: French Horn
  token: F
  aliases: [horn]
- name: Trombone
  token: concert-bass
  aliases: [trombone, tuba]
- name: Euphonium
  label: Euphonium / Baritone
  token: concert-bass
  aliases: [trombone, tuba]
- name: Bass
  label: Tuba / Sousaphone / Bass
  token: concert-bass
  aliases: [tuba]
